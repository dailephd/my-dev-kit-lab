name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os:
          # Playwright 1.60.0 supports Ubuntu 24.04, not Ubuntu 26.04.
          - ubuntu-24.04
          - macos-latest
          - windows-latest
        node-version:
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Current-route authorization requires baseline ancestry.

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare physical project-owned public test environment
        run: node scripts/run-verification-lane.mjs --prepare-ci

      - name: Print runtime versions
        run: |
          node --version
          npm --version
          python --version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Ubuntu)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build and verify benchmark contracts
        run: npm run verify

      - name: Collect current LAB-KIT native platform evidence
        run: node scripts/verify-private-provenance.mjs --current collect --lane platform --out .my-dev-kit-workflow/tmp/current-kit-native/collection

      - name: Independently verify current LAB-KIT native platform evidence
        run: node scripts/verify-private-provenance.mjs --current verify --inputs .my-dev-kit-workflow/tmp/current-kit-native/collection/manifest.json --out .my-dev-kit-workflow/tmp/current-kit-native/verification

      - name: Retain current LAB-KIT native platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-kit-native-${{ runner.os }}
          path: .my-dev-kit-workflow/tmp/current-kit-native/
          include-hidden-files: true
          if-no-files-found: error

      - name: Test
        # Whole-repository Kit scans run in the required repository-self-scans
        # matrix below so their nested lookup processes cannot starve campaign tests.
        run: npm test -- --exclude tests/audits/kitSourceDifferential.test.ts --exclude tests/audits/kitSourceReaderReplacement.test.ts --exclude tests/audits/codeRot/testRotDetector.test.ts --exclude tests/audits/codeRot/duplicateImplementationDetector.test.ts

      - name: Describe mandatory protected release gates
        run: node -e "console.log('PUBLIC CI ONLY. Private provenance and exact-commit binding are separate mandatory release-readiness gates; neither was executed or passed by this job.')"

      - name: Verify packed package
        run: npm run verify:packed-package

  repository-self-scans:
    name: Repository self-scans / ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare physical project-owned public test environment
        run: node scripts/run-verification-lane.mjs --prepare-ci
      - name: Install dependencies
        run: npm ci
      - name: Test complete repository-audit files without campaign contention
        run: npm test -- tests/audits/codeRot/testRotDetector.test.ts tests/audits/codeRot/duplicateImplementationDetector.test.ts --maxWorkers 1
