name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Print runtime versions
        run: |
          node --version
          npm --version
          python --version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Ubuntu)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Verify (includes the sole build and benchmark checks)
        run: npm run verify

      - name: Test
        run: npm run test

      - name: Verify packed package
        run: npm run verify:packed-package
