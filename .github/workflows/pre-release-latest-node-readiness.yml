name: Pre-release latest Node readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-node-readiness:
    name: ${{ matrix.os }} / Node latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          # Playwright 1.60.0 supports Ubuntu 24.04.
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare physical project-owned public test environment
        run: node scripts/run-verification-lane.mjs --prepare-ci

      - name: Print runtime versions
        run: |
          node --version
          npm --version
          python --version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Ubuntu)
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        run: node node_modules/playwright/cli.js install chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: node node_modules/playwright/cli.js install chromium

      - name: Run real-browser tutorial test
        run: npm run test:tutorial-browser

      - name: Check documentation consistency
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify
        id: verify
        run: npm run verify

      - name: Test Windows campaign execution without parallel-file contention
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.verify.outcome == 'success' }}
        run: npm run test:public -- tests/experiments/agentSuccessRate/campaignExecution.test.ts

      - name: Run public functional and audit tests
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: npm run test:public -- --exclude tests/audits/codeRot/testRotDetector.test.ts --exclude tests/audits/codeRot/duplicateImplementationDetector.test.ts ${{ runner.os == 'Windows' && '--exclude tests/experiments/agentSuccessRate/campaignExecution.test.ts' || '' }}

      - name: Run complete repository-self-scan test files
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: npm run test:public -- tests/audits/codeRot/testRotDetector.test.ts tests/audits/codeRot/duplicateImplementationDetector.test.ts --maxWorkers 1

      - name: Security validation
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: npm run security:validate -- --format text,json

      - name: Verify packed package
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: npm run verify:packed-package

      - name: Code rot audit
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: npm run audit -- --types code-rot --format text,json --fail-on none

      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-reports-${{ matrix.os }}-node-latest
          path: |
            reports/audits/code-rot/
            reports/security/
          if-no-files-found: warn
          retention-days: 7
